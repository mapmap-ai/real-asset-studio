<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>부동산 지도 작업실</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f4f5f8;--side:#fff;--fg:#2d2d2d;--mute:#6b6b6b;--num:#8a8a8a;--acc:#D04A02;--hl:#FBEFE9;--line:#ececec}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);font:14px/1.5 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--fg)}
nav{width:300px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 0 18px}
.brand{padding:0 24px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand b{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-.4px;color:var(--fg)}
.brand b svg{width:24px;height:24px;flex:none}
.brand .sub{display:block;color:var(--mute);font-size:13px;margin-top:10px}
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.menu button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:14px;align-items:flex-start;
  padding:14px 24px 14px 21px;border-left:3px solid transparent;color:var(--fg);transition:background .15s}
.menu button:hover{background:#faf6f3}
.menu button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.menu button[aria-current="page"]{background:var(--hl);border-left-color:var(--acc)}
.menu .ar{font:600 13px/1.9 Consolas,"D2Coding",monospace;color:var(--num);letter-spacing:.5px}
.menu button[aria-current="page"] .ar{color:var(--acc)}
.menu .t{display:block;font-weight:800;font-size:16.5px;letter-spacing:-.3px}
.menu .d{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.foot{margin-top:auto;color:var(--mute);font-size:11.5px;padding:0 24px}
.foot:empty{display:none}
nav{position:relative;transition:width .18s ease}
.navt{all:unset;box-sizing:border-box;position:absolute;top:22px;right:10px;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--num);font-size:15px;line-height:1}
.navt:hover{background:#f4f1ee;color:var(--fg)}
.navt:focus-visible{outline:2px solid var(--acc)}
body.navmin nav{width:68px}
body.navmin .brand{padding:0 0 20px;display:flex;justify-content:center}
body.navmin .brand b{gap:0}
body.navmin .brand .tt,body.navmin .brand .sub,body.navmin .menu .t,body.navmin .menu .d,body.navmin .foot{display:none}
body.navmin .menu button{padding:14px 0;justify-content:center}
body.navmin .navt{position:static;margin:0 auto 10px;display:flex}
body.navmin nav{padding-top:18px}
main{flex:1;min-width:0;position:relative}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
main iframe.on{display:block}
@media (max-width:760px){
  body{flex-direction:column}
  nav{width:auto;padding:12px 0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 14px 10px;margin-bottom:6px}
  .menu{flex-direction:row}
  .menu{overflow-x:auto;gap:0}
  .menu li{flex:none}
  .menu button{padding:8px 12px;gap:6px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  .menu .t{font-size:14px}
  .menu .ar{line-height:1.6}
  .menu button[aria-current="page"]{border-bottom-color:var(--acc)}
  .menu .d,.foot,.brand .sub,.navt{display:none}
  body.navmin nav{width:auto}
  main{flex:1}
}
</style></head><body>

  <ul class="menu" id="menu"></ul>
  <div class="foot"></div>
</nav>

const menu = document.getElementById("menu"), main = document.getElementById("main");
const dec = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
const frames = {}, btns = [];
PAGES.forEach((p, i) => {
  const li = document.createElement("li"), b = document.createElement("button");
  b.innerHTML = `<span class="ar">${NUM ? String(i + 1).padStart(2, "0") : "▶"}</span><span><span class="t"></span><span class="d"></span></span>`;
  b.querySelector(".t").textContent = p.label; b.querySelector(".d").textContent = p.desc || "";
  b.title = p.label; b.onclick = () => show(i);
  li.appendChild(b); menu.appendChild(li); btns.push(b);
});
function show(i){
  if (!frames[i]) {
    const f = document.createElement("iframe");
    f.title = PAGES[i].label; f.allow = "clipboard-read; clipboard-write; fullscreen";
    f.srcdoc = dec(PAGES[i].b64); main.appendChild(f); frames[i] = f;
  }
  Object.entries(frames).forEach(([k, f]) => f.classList.toggle("on", +k === i));
  btns.forEach((b, k) => k === i ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  document.title = PAGES[i].label + " · 부동산 지도 작업실";
  try { history.replaceState(null, "", "#p" + (i + 1)); } catch (e) {}
  // 숨겨졌던 지도(Leaflet 등)가 크기를 다시 재도록
  try { frames[i].contentWindow.dispatchEvent(new Event("resize")); } catch (e) {}
}
// 왼쪽 메뉴 줄이기·키우기(2026-10-21): 이 브라우저에 기억. 줄이면 아이콘·번호만, 번호에 마우스를 올리면 메뉴 이름
const navt = document.getElementById("navt");
function navMin(on){
  document.body.classList.toggle("navmin", on);
  navt.textContent = on ? "»" : "«"; navt.title = navt.ariaLabel = on ? "메뉴 키우기" : "메뉴 줄이기"; navt.setAttribute("aria-expanded", String(!on));
  try { localStorage.setItem("tabsNavMin", on ? "1" : "0"); } catch (e) {}
  setTimeout(() => Object.values(frames).forEach(f => { try { f.contentWindow.dispatchEvent(new Event("resize")); } catch (e) {} }), 220);
}
navt.onclick = () => navMin(!document.body.classList.contains("navmin"));
try { if (localStorage.getItem("tabsNavMin") === "1") navMin(true); } catch (e) {}
const h = /^#p(\d+)$/.exec(location.hash);
show(h && PAGES[h[1] - 1] ? h[1] - 1 : 0);
