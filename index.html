<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>부동산 지도 작업실</title>
<style>
:root{--bg:#f4f5f8;--side:#141a2e;--side2:#1e2640;--fg:#e8ebf5;--mute:#8d96b3;--acc:#ffb547;--line:#2b3454}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
nav{width:270px;flex:none;background:linear-gradient(180deg,var(--side),#0d1222);color:var(--fg);display:flex;flex-direction:column;padding:22px 14px}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand b{display:block;font-size:19px;letter-spacing:-.3px}
.brand span{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.menu button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  padding:12px 12px;border-radius:10px;color:var(--fg);transition:background .15s}
.menu button:hover{background:var(--side2)}
.menu button:focus-visible{outline:2px solid var(--acc)}
.menu button[aria-current="page"]{background:var(--side2);box-shadow:inset 3px 0 0 var(--acc)}
.menu .ar{color:var(--mute);font-size:12px;margin-top:3px;transition:color .15s,transform .15s}
.menu button[aria-current="page"] .ar{color:var(--acc);transform:translateX(2px)}
.menu .t{display:block;font-weight:700;font-size:15px}
.menu .d{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.foot{margin-top:auto;color:var(--mute);font-size:11.5px;padding:0 8px}
main{flex:1;min-width:0;position:relative}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
main iframe.on{display:block}
@media (max-width:760px){
  body{flex-direction:column}
  nav{width:auto;padding:12px}
  .brand{padding-bottom:10px;margin-bottom:8px}
  .menu{flex-direction:row}
  .menu .d,.foot{display:none}
  main{flex:1}
}
</style></head><body>
<nav>
  <div class="brand"><b>부동산 지도 작업실</b><span>부동산 업무시 필요한 기능을 넣었습니다</span></div>
  <ul class="menu" id="menu"></ul>
  <div class="foot"></div>
</nav>
<main id="main"></main>

const menu = document.getElementById("menu"), main = document.getElementById("main");
const dec = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
const frames = {}, btns = [];
PAGES.forEach((p, i) => {
  const li = document.createElement("li"), b = document.createElement("button");
  b.innerHTML = `<span class="ar">▶</span><span><span class="t"></span><span class="d"></span></span>`;
  b.querySelector(".t").textContent = p.label; b.querySelector(".d").textContent = p.desc || "";
  b.onclick = () => show(i);
  li.appendChild(b); menu.appendChild(li); btns.push(b);
});
function show(i){
  if (!frames[i]) {
    const f = document.createElement("iframe");
    f.title = PAGES[i].label; f.allow = "clipboard-read; clipboard-write; fullscreen";
    f.srcdoc = dec(PAGES[i].b64); main.appendChild(f); frames[i] = f;
  }
  Object.entries(frames).forEach(([k, f]) => f.classList.toggle("on", +k === i));
  btns.forEach((b, k) => k === i ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  document.title = PAGES[i].label + " · 부동산 지도 작업실";
  try { history.replaceState(null, "", "#p" + (i + 1)); } catch (e) {}
  // 숨겨졌던 지도(Leaflet 등)가 크기를 다시 재도록
  try { frames[i].contentWindow.dispatchEvent(new Event("resize")); } catch (e) {}
}
const h = /^#p(\d+)$/.exec(location.hash);
show(h && PAGES[h[1] - 1] ? h[1] - 1 : 0);
