<body><div class="c"><h1>부동산 지도 작업실 내려받기</h1><p id="m">파일을 준비하는 중…</p>

<p class="s">받은 파일(부동산_지도_작업실.html)을 더블클릭하면 인터넷 창에서 작업실이 열립니다. ②·③ 북마크는 늘 웹의 최신 코드를 불러옵니다.<br><a href="./">내려받지 않고 웹에서 바로 열기</a></p></div>
<script>
(async () => {
  const m = document.getElementById("m"), b = document.getElementById("b");
  try {
    const r = await fetch("index.html?v=" + Date.now(), { cache: "no-store" });
    const u = URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: "text/html" }));
    b.href = u; b.click();
    m.textContent = "내려받기를 시작했습니다. 브라우저 아래쪽(또는 오른쪽 위) 내려받기 목록을 확인하세요.";

})();
</script></body></html>
